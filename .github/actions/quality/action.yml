name: Quality checks
description: Check shell syntax, Python tests, documentation, and Rust quality.
runs:
  using: composite
  steps:
    - name: Check shell syntax
      shell: bash
      run: for script in scripts/*.sh; do sh -n "$script" || exit; done
    - name: Run Python tests
      shell: bash
      run: python3 -m unittest discover -s tests -p 'test_*.py'
    - name: Check documentation
      shell: bash
      run: python3 scripts/check-docs.py
    - name: Check Rust formatting
      shell: bash
      run: cargo fmt --check
    - name: Run Clippy
      shell: bash
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Run Rust tests
      shell: bash
      run: cargo test --locked --all-targets
    - name: Run doctests
      shell: bash
      run: cargo test --locked --doc
