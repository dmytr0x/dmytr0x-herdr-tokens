name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          update-environment: true
      - run: python3 --version
      - name: Match tag and manifest versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          plugin = tomllib.loads(pathlib.Path("herdr-plugin.toml").read_text())
          cargo_version = cargo["package"]["version"]
          plugin_version = plugin["version"]
          expected_tag = f"v{cargo_version}"

          if plugin_version != cargo_version:
              raise SystemExit(
                  f"version mismatch: Cargo.toml={cargo_version}, "
                  f"herdr-plugin.toml={plugin_version}"
              )
          if tag != expected_tag:
              raise SystemExit(f"release tag must be {expected_tag}, got {tag}")
          PY

  quality:
    name: Test release source
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master; Rust 1.94.0
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          update-environment: true
      - run: python3 --version
      - uses: ./.github/actions/quality

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # Keep both builds on the same supported ARM64 macOS generation as CI.
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            # Cross-built only; the packaging smoke step skips execution on ARM64.
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record macOS runner evidence
        if: runner.os == 'macOS'
        run: |
          {
            echo '### macOS runner'
            sw_vers
            uname -m
            echo "ImageOS: $ImageOS"
            echo "ImageVersion: $ImageVersion"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master; Rust 1.94.0
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Record macOS deployment evidence
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "### $TARGET deployment metadata"
            echo "MACOSX_DEPLOYMENT_TARGET: ${MACOSX_DEPLOYMENT_TARGET:-unset (toolchain default)}"
            echo "Selected SDK: $(xcrun --show-sdk-version)"
            echo '```text'
            otool -l "target/$TARGET/release/herdr-tokens" | awk '
              /cmd LC_BUILD_VERSION|cmd LC_VERSION_MIN_MACOSX/ { remaining = 6 }
              remaining > 0 { print; remaining-- }
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package release binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${RELEASE_TAG#v}"
          archive="herdr-tokens-${version}-${TARGET}.tar.gz"
          mkdir staging
          cp "target/${TARGET}/release/herdr-tokens" staging/herdr-tokens
          chmod 755 staging/herdr-tokens
          COPYFILE_DISABLE=1 tar -C staging -czf "$archive" herdr-tokens
      - name: Smoke test packaged executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir smoke
          tar -xzf herdr-tokens-*.tar.gz -C smoke
          case "$(uname -m):$TARGET" in
            x86_64:x86_64-*|arm64:aarch64-*|aarch64:aarch64-*)
              ./smoke/herdr-tokens --version
              ./smoke/herdr-tokens validate --config-dir "$PWD/examples"
              echo "$TARGET: packaged binary version and example validation passed on $(uname -sm)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "$TARGET: built and packaged; not executed on $(uname -sm)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-tokens-${{ matrix.target }}
          path: herdr-tokens-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: sh ../scripts/publish-release.sh
