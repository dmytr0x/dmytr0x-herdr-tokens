name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Keep the supported ARM64 macOS generation aligned with Release.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Record macOS runner evidence
        if: runner.os == 'macOS'
        run: |
          {
            echo '### macOS runner'
            sw_vers
            uname -m
            echo "ImageOS: $ImageOS"
            echo "ImageVersion: $ImageVersion"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          update-environment: true
      - run: python3 --version
      - uses: Swatinem/rust-cache@v2
      - run: for script in scripts/*.sh; do sh -n "$script" || exit; done
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check-docs.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo build --release --locked
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          update-environment: true
      - run: python3 --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --locked --all-targets --summary-only --fail-under-lines 90
