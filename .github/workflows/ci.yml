name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Keep the supported ARM64 macOS generation aligned with Release.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Record macOS runner evidence
        if: runner.os == 'macOS'
        run: |
          {
            echo '### macOS runner'
            sw_vers
            uname -m
            echo "ImageOS: $ImageOS"
            echo "ImageVersion: $ImageVersion"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          update-environment: true
      - run: python3 --version
      - name: Check installed Git prerequisite
        shell: python
        run: |
          import re
          import subprocess
          import sys

          minimum = (2, 36)

          def parse_version(output):
              match = re.fullmatch(
                  r"git version ([0-9]+)\.([0-9]+)(?:\.[0-9]+)?(?:[ .+-][^\r\n]+)?",
                  output.strip(),
              )
              return tuple(map(int, match.groups())) if match else None

          for output, expected in (
              ("git version 2.35.9", False),
              ("git version 2.36.0", True),
              ("git version 2.100.0", True),
              ("git version 3.0.0", True),
              ("git version 2.39.5 (Apple Git-154)", True),
              ("git version 2.36", True),
              ("malformed output", False),
              ("git version 2", False),
              ("git version 2.36garbage", False),
          ):
              version = parse_version(output)
              if (version is not None and version >= minimum) != expected:
                  sys.exit(f"Git version parser fixture failed: {output!r}")

          try:
              result = subprocess.run(
                  ["git", "--version"], check=True, capture_output=True, text=True,
              )
          except OSError as error:
              sys.exit(f"Git >=2.36 is required; cannot execute git: {error}")
          except subprocess.CalledProcessError as error:
              sys.exit(
                  f"git --version failed (exit {error.returncode}): "
                  f"{error.stdout}{error.stderr}"
              )

          print(result.stdout, end="" if result.stdout.endswith("\n") else "\n", flush=True)
          version = parse_version(result.stdout)
          if version is None:
              sys.exit(f"Cannot parse git --version output: {result.stdout!r}")
          if version < minimum:
              sys.exit("Git >=2.36 is required; the installed Git is too old.")
      - uses: Swatinem/rust-cache@v2
      - run: for script in scripts/*.sh; do sh -n "$script" || exit; done
      - name: Install ShellCheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Record ShellCheck version
        if: runner.os == 'Linux'
        run: shellcheck --version
      - name: Lint POSIX shell scripts
        if: runner.os == 'Linux'
        run: shellcheck --shell=sh scripts/*.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check-docs.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo build --release --locked
  musl:
    # Keep the x86-64 musl runner aligned with Release.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install Linux linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build x86-64 musl release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          update-environment: true
      - run: python3 --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov@0.9.1
          checksum: true
          fallback: none
      - run: cargo llvm-cov --version
      - name: Check coverage
        shell: bash
        run: |
          set -o pipefail
          cargo llvm-cov --locked --all-targets --summary-only --fail-under-lines 90 2>&1 | tee "$RUNNER_TEMP/coverage-summary.txt"
      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            printf '## Coverage summary\n\n'
            if [[ -f "$RUNNER_TEMP/coverage-summary.txt" ]]; then
              printf '```text\n'
              cat "$RUNNER_TEMP/coverage-summary.txt"
              printf '\n```\n'
            else
              printf 'No coverage report was produced.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
