name: Advisory audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master; Rust 1.94.0
        with:
          toolchain: 1.94.0
      - name: Install cargo-audit
        # This release declares Rust 1.88, compatible with Rust 1.94.0:
        # https://github.com/rustsec/rustsec/blob/cargo-audit/v0.22.2/cargo-audit/Cargo.toml
        run: cargo install cargo-audit --version '=0.22.2' --locked
      - name: Audit committed lockfile
        run: cargo audit --deny unmaintained --file Cargo.lock
      - name: Verify lockfile is unchanged
        if: always() && steps.checkout.outcome == 'success'
        run: git diff --exit-code HEAD -- Cargo.lock
