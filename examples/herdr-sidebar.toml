# Merge into HERDR's config.toml, not the plugin's tokens.toml.
# Herdr 0.9.1: token fg uses #RGB or #RRGGBB (not palette names).
[ui.sidebar.spaces]
rows = [
  ["workspace", "branch", "git_status"],
  [
    { token = "$git_modified", fg = "#f9e2af" },
    { token = "$git_staged", fg = "#a6e3a1" },
    { token = "$git_untracked", fg = "#89b4fa" },
    { token = "$git_conflicts", fg = "#f38ba8" },
  ],
]

# Optional shared sidebar/active-row background; NOT a per-token background.
